<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Neuro-Mechanical Animal | Somatic Healing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Da Vinci & Low Blue Light Structural Aesthetic */
        :root {
            --bg-parchment: #eedfc4;       /* Solid golden parchment */
            --bg-dark-block: #1e1a15;      /* Structural charcoal */
            --text-dark: #2c2217;          /* Deep sepia ink */
            --text-light: #f5edd7;         /* Antique text */
            --gold-accent: #b8860b;        /* Renaissance amber */
            --gold-glow: #e5c158;          /* Glowing gold */
            --border-ink: #8a765d;         /* Structural lines */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-parchment);
            color: var(--text-dark);
            font-family: 'Libre Baskerville', serif;
            line-height: 1.6;
            margin: 0;
        }

        /* Top Floating Booking Banner */
        .top-nav {
            background-color: #1a1510;
            padding: 15px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--gold-accent);
            display: flex;
            justify-content: center;
        }

        .nav-btn {
            color: var(--gold-glow);
            text-decoration: none;
            border: 1px solid var(--gold-accent);
            padding: 10px 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background-color: var(--gold-accent);
            color: #1a1510;
        }

        /* Maximum footprint expansion for wide computer screens */
        .main-wrapper {
            max-width: 1400px;
            width: 95%;
            margin: 0 auto;
            padding: 60px 25px;
        }

        /* Header Style Flex for Heart Branding Integration */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-bottom: 70px;
            padding-bottom: 30px;
            border-bottom: 1px double var(--border-ink);
        }

        .header-text {
            text-align: left;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: #1a1510;
            margin-bottom: 10px;
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            color: #5c4a37;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .header-heart-branding img {
            max-width: 140px;
            height: auto;
            opacity: 0.85;
            mix-blend-mode: multiply;
            filter: sepia(0.2);
        }

        @media (max-width: 850px) {
            header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
            .header-text {
                text-align: center;
            }
        }

        /* Balanced 50/50 Desktop Layout Grid */
        .intro-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
            margin-bottom: 80px;
        }

        @media (max-width: 1024px) {
            .intro-split {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        /* Wide structural layout grids */
        .content-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 60px;
            margin-bottom: 80px;
            align-items: center;
        }

        @media (max-width: 1024px) {
            .content-layout {
                grid-template-columns: 1fr;
            }
            .sketch-side {
                order: -1;
                margin: 0 auto;
            }
        }

        h2 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            color: #1a1510;
            border-bottom: 1px solid var(--border-ink);
            padding-bottom: 8px;

        h3 {

            margin-top: 35px;

            color: #1a1510;
        }

        p {

            font-size: 1.15rem;
            text-align: justify;
            width: 100%;
        }

        .sketch-side {

        .sketch-side img {

            height: auto;
            opacity: 0.9;

            filter: sepia(0.2);
            margin-bottom: 20px;

        /* Instruction Box Styling for Manuals */
        .venmo-instructions {
            border-left: 3px solid var(--gold-accent);
            background-color: rgba(184, 134, 11, 0.05);
            padding: 20px;
            margin-bottom: 35px;

        }

            width: 100%;
        }

        .practitioner-sidebar .sidebar-heading {
            color: var(--gold-glow);
            font-size: 1.8rem;

            border-bottom: 1px solid #4a3e31;
            padding-bottom: 8px;
        }

        .photo-frame {

            height: 440px;
            border: 2px solid var(--gold-glow);
            overflow: hidden;
            background-color: #110e0b;
            margin-bottom: 25px;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .practitioner-sidebar h2 {
            color: var(--gold-glow);
            border-bottom: 1px solid #4a3e31;
            margin-bottom: 10px;
            font-size: 1.6rem;
            text-transform: none;

            padding-bottom: 5px;
        }

        .practitioner-sidebar p {

            font-size: 1.05rem;
            line-height: 1.6;
            text-align: justify;
            margin-bottom: 15px;
        }

            font-size: 0.85rem;
            color: var(--gold-glow);
            margin-bottom: 25px;
            font-style: italic;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .contact-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-outline {
            font-family: 'Montserrat', sans-serif;
            text-decoration: none;
            color: var(--gold-glow);
            border: 1px solid var(--gold-glow);
            padding: 12px 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            transition: all 0.3s;
        }

        .btn-outline:hover {
            background-color: var(--gold-glow);
            color: var(--bg-dark-block);
        }

        /* Digital Guides Layout Fix */
        .offers-grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin: 30px 0;
        }

        .guide-card {
            border: 1px solid var(--border-ink);
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .guide-card.full-bundle {
            border: 2px solid var(--gold-accent);
            background-color: rgba(184, 134, 11, 0.05);
        }

        .price-tag {
            font-size: 1.8rem;
            color: #1a1510;
            font-weight: 700;
            margin: 10px 0;
        }

        .buy-link {
            display: inline-block;
            margin-top: 15px;
            color: #1a1510;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-decoration: none;
        }

        /* Rates Formatting */
        .rates-list {
            list-style: none;
            margin: 20px 0 40px 0;
        }

        .rates-list li {
            padding: 15px 0;
            border-bottom: 1px dashed var(--border-ink);
            font-size: 1.15rem;
            display: flex;
            justify-content: space-between;
        }

        .rates-list li span {
            font-weight: 700;
            color: #1a1510;
        }

        footer {
            text-align: center;
            margin-top: 100px;
            padding: 40px 0;
            border-top: 1px solid var(--border-ink);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            color: #5c4a37;
        }
